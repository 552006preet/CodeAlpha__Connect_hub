<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ConnectHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">ConnectHub</div>
    <div class="nav-links">
        <a href="index.html">🏠 Home</a>
        <a href="profile.html" id="profile-nav" style="display:none;">👤 Profile</a>
        <a href="login.html" id="login-nav">Login</a>
        <a href="#" id="logout-nav" style="display:none;" onclick="logoutUser()">Logout</a>
    </div>
</nav>

<div class="profile-container">
    <div id="profile-content"></div>
    <div id="user-posts-feed" class="feed" style="margin-top:16px;"></div>
</div>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightbox-img" src="" alt="full image">
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
function getUserIdFromURL() {
    var p = new URLSearchParams(window.location.search);
    return p.get("id") ? parseInt(p.get("id")) : null;
}

function loadProfile() {
    var currentUser = getCurrentUser();
    var targetId = getUserIdFromURL() || (currentUser ? currentUser.id : null);
    if (!targetId) { window.location.href = "login.html"; return; }

    var users = JSON.parse(localStorage.getItem("sm_users")) || [];
    var profileUser = null;
    for (var i = 0; i < users.length; i++) {
        if (users[i].id === targetId) { profileUser = users[i]; break; }
    }

    var container = document.getElementById("profile-content");
    if (!profileUser) { container.innerHTML = "<div class='no-posts'>User not found.</div>"; return; }

    var isOwn = currentUser && currentUser.id === profileUser.id;
    var isFollowing = currentUser && (profileUser.followers || []).includes(currentUser.id);

    container.innerHTML = `
        <div class="profile-header">
            <div class="profile-top">
                <div class="profile-avatar">${getInitial(profileUser.name)}</div>
                <div class="profile-info">
                    <h2>${profileUser.name}</h2>
                    <p class="bio">${profileUser.bio || "No bio yet."}</p>
                    <div class="profile-stats">
                        <div class="stat"><strong>${(profileUser.followers||[]).length}</strong><span>Followers</span></div>
                        <div class="stat"><strong>${(profileUser.following||[]).length}</strong><span>Following</span></div>
                        <div class="stat"><strong id="post-count">0</strong><span>Posts</span></div>
                    </div>
                    ${!isOwn && currentUser ? `<button class="follow-btn ${isFollowing?'following':''}" onclick="toggleFollow(${profileUser.id})">${isFollowing ? '✓ Following' : '+ Follow'}</button>` : ""}
                </div>
            </div>
        </div>`;

    // load this user's posts
    var allPosts = getPosts();
    var userPosts = allPosts.filter(function(p) { return p.authorId === profileUser.id; });
    document.getElementById("post-count").textContent = userPosts.length;

    var feedEl = document.getElementById("user-posts-feed");
    feedEl.innerHTML = "";

    if (userPosts.length === 0) {
        feedEl.innerHTML = "<div class='no-posts'><div style='font-size:40px;margin-bottom:10px;'>📝</div><p>No posts yet.</p></div>";
        return;
    }

    userPosts.forEach(function(post) {
        var card = document.createElement("div");
        card.className = "post-card";
        var likeCount = (post.likes||[]).length;
        var commentCount = (post.comments||[]).length;
        card.innerHTML = `
            <div class="post-header">
                <div class="avatar">${getInitial(post.authorName)}</div>
                <div class="post-author-info">
                    <div class="author-name">${post.authorName}</div>
                    <div class="post-time">${timeAgo(post.time)}</div>
                </div>
            </div>
            ${post.content ? `<div class="post-text">${post.content}</div>` : ""}
            ${buildMediaHTML(post.media || [])}
            <div class="post-stats">
                ${likeCount > 0 ? `<span>👍 ${likeCount} like${likeCount>1?'s':''}</span>` : ""}
                ${commentCount > 0 ? `<span>💬 ${commentCount} comment${commentCount>1?'s':''}</span>` : ""}
            </div>`;
        feedEl.appendChild(card);
    });
}

function toggleFollow(targetId) {
    var currentUser = getCurrentUser();
    if (!currentUser) return;
    var users = JSON.parse(localStorage.getItem("sm_users")) || [];
    var target = null, current = null;
    for (var i = 0; i < users.length; i++) {
        if (users[i].id === targetId) target = users[i];
        if (users[i].id === currentUser.id) current = users[i];
    }
    if (!target || !current) return;
    var idx = (target.followers||[]).indexOf(currentUser.id);
    if (idx > -1) {
        target.followers.splice(idx, 1);
        var idx2 = (current.following||[]).indexOf(targetId);
        if (idx2 > -1) current.following.splice(idx2, 1);
    } else {
        if (!target.followers) target.followers = [];
        if (!current.following) current.following = [];
        target.followers.push(currentUser.id);
        current.following.push(targetId);
    }
    localStorage.setItem("sm_users", JSON.stringify(users));
    loadProfile();
}

window.onload = function() {
    updateNavbar();
    loadProfile();
    var lb = document.getElementById("lightbox");
    if (lb) lb.addEventListener("click", function(e) { if (e.target === lb) closeLightbox(); });
};
</script>
</body>
</html>
